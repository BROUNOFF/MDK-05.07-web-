server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # запросы к API передаём контейнеру backend
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
  }

  # любые другие адреса (/library, /profile...) открывают React-приложение
  location / {
    try_files $uri /index.html;
  }
}
